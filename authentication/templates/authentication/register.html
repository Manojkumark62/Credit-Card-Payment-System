{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CardFlow</title>
    <link rel="stylesheet" href="{% static 'authentication/style.css' %}">
</head>
<body>

<div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
</div>

<nav class="navbar">
    <a href="{% url 'auth_login_page' %}" class="logo">Card<span>Flow</span></a>
    <a href="{% url 'auth_login_page' %}" class="nav-link">Already have an account?</a>
</nav>

<main class="auth-page">

```
<div class="auth-card">

    <div class="brand-icon">✦</div>

    <h1>Create your account</h1>
    <p class="subtitle">Start your secure CardFlow journey.</p>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="message">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-box">
                <input type="password" name="password" id="password" placeholder="Create a strong password" required>
                <button type="button" class="toggle" data-target="password">👁</button>
            </div>
            <div class="strength"><span id="strengthBar"></span></div>
            <small id="strengthText">Enter a password</small>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-box">
                <input type="password" name="password_confirm" id="passwordConfirm" placeholder="Repeat your password" required>
                <button type="button" class="toggle" data-target="passwordConfirm">👁</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">Create Account <span>→</span></button>
    </form>

    <div class="bottom-text">
        Already registered?
        <a href="{% url 'auth_login_page' %}">Sign in</a>
    </div>

</div>
```

</main>

<script src="{% static 'authentication/script.js' %}"></script>

</body>
</html>
